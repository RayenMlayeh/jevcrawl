<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-label="Cost per correct answer">
<title>Cost per correct answer</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5DFC"/><stop offset="1" stop-color="#22C3EE"/></linearGradient></defs>
<text x="24.0" y="38.0" fill="#1F2328" font-size="22" font-weight="700" text-anchor="start">What one correct answer costs</text>
<text x="24.0" y="62.0" fill="#59636E" font-size="14" font-weight="400" text-anchor="start">Cost per task ÷ accuracy, same 50 tasks</text>
<rect x="12.0" y="92.0" width="956.0" height="50" rx="12" fill="#6D5DFC14"/>
<text x="24.0" y="122.0" fill="#1F2328" font-size="16" font-weight="700" text-anchor="start">jevcrawl</text>
<rect x="236.0" y="106.0" width="12.3" height="20" rx="10.0" fill="url(#g)"/>
<text x="260.3" y="122.0" fill="#1F2328" font-size="16" font-weight="800" text-anchor="start">$0.06</text>
<text x="24.0" y="180.0" fill="#1F2328" font-size="16" font-weight="500" text-anchor="start">Claude picks every link</text>
<rect x="236.0" y="164.0" width="127.1" height="20" rx="10.0" fill="#AEB8C2"/>
<text x="375.1" y="180.0" fill="#1F2328" font-size="16" font-weight="400" text-anchor="start">$0.65</text>
<text x="24.0" y="238.0" fill="#1F2328" font-size="16" font-weight="500" text-anchor="start">Breadth-first crawl</text>
<rect x="236.0" y="222.0" width="560.0" height="20" rx="10.0" fill="#AEB8C2"/>
<text x="808.0" y="238.0" fill="#1F2328" font-size="16" font-weight="400" text-anchor="start">$2.85</text>
<text x="24.0" y="296.0" fill="#1F2328" font-size="15" font-weight="600" text-anchor="start">jevcrawl: 10x less than letting Claude pick the links, 46x less than a breadth-first crawl</text>
</svg>
