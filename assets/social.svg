<text x="276" y="194" font-size="104" font-weight="800" letter-spacing="-3"><tspan fill="url(#g)">jev</tspan><tspan fill="#F0F6FC">crawl</tspan></text>
<text x="96.0" y="312.0" fill="#F0F6FC" font-size="44" font-weight="700" text-anchor="start">The web crawler for AI agents that finds</text>
<text x="96.0" y="366.0" fill="#F0F6FC" font-size="44" font-weight="700" text-anchor="start">the answer, not just pages.</text>
<text x="96.0" y="462.0" fill="#22C3EE" font-size="56" font-weight="800" text-anchor="start">2x</text>
<text x="96.0" y="500.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">answer pages found</text>
<text x="96.0" y="528.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">vs Crawl4AI</text>
<text x="466.0" y="462.0" fill="#A5A0FF" font-size="56" font-weight="800" text-anchor="start">10x</text>
<text x="466.0" y="500.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">cheaper per answer</text>
<text x="466.0" y="528.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">than Claude crawling</text>
<text x="836.0" y="462.0" fill="#22C3EE" font-size="56" font-weight="800" text-anchor="start">MCP</text>
<text x="836.0" y="500.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">Claude Code, Cursor,</text>
<text x="836.0" y="528.0" fill="#9198A1" font-size="22" font-weight="400" text-anchor="start">Claude Desktop</text>
<text x="96.0" y="598.0" fill="#6E7781" font-size="20" font-weight="400" text-anchor="start">github.com/RayenMlayeh/jevcrawl · Apache-2.0</text>
